aid: apache-giraph
name: Apache Giraph
description: >-
  Apache Giraph is an iterative graph processing system built for high scalability on Apache Hadoop. It is modeled after
  Google's Pregel and provides a simple yet flexible Java API for graph algorithms at massive scale using the Bulk
  Synchronous Parallel (BSP) model. Note - Apache Giraph has been retired as of 2024.
