naftiko: "1.0.0-alpha1"
info:
  label: "Apache Giraph Graph Processing"
  description: "Capability for monitoring Apache Giraph graph processing jobs on Hadoop YARN — tracking job status, completion progress, and cluster capacity. Designed for data engineers running large-scale graph algorithms. Note - Apache Giraph has been retired."
  tags:
    - Apache Giraph
    - Graph Processing
    - Big Data
    - Hadoop
    - Monitoring
  created: "2026-04-19"
  modified: "2026-04-19"
binds:
  - namespace: env
    keys:
      YARN_RESOURCEMANAGER_URL: YARN_RESOURCEMANAGER_URL
capability:
  consumes:
    - import: giraph-job
      location: ./shared/giraph-job.yaml
  exposes:
    - type: rest
      port: 8080
      namespace: giraph-processing-api
      description: "REST API for Apache Giraph graph processing job monitoring."
      resources:
        - path: /v1/jobs
          name: jobs
          description: Giraph graph processing jobs
          operations:
            - method: GET
              name: list-jobs
              description: List all Giraph graph processing jobs
              call: "giraph-job.list-giraph-jobs"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/cluster/metrics
          name: metrics
          description: Cluster capacity metrics
          operations:
            - method: GET
              name: get-metrics
              description: Get YARN cluster metrics
              call: "giraph-job.get-cluster-metrics"
              outputParameters:
                - type: object
                  mapping: "$."
    - type: mcp
      port: 9090
      namespace: giraph-processing-mcp
      transport: http
      description: "MCP server for AI-assisted Apache Giraph graph processing monitoring."
      tools:
        - name: list-giraph-jobs
          description: List all Giraph graph processing jobs running on YARN
          hints:
            readOnly: true
            openWorld: true
          call: "giraph-job.list-giraph-jobs"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-giraph-job
          description: Get detailed status of a specific Giraph job
          hints:
            readOnly: true
            openWorld: true
          call: "giraph-job.get-giraph-job"
          with:
            appId: "tools.appId"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-cluster-metrics
          description: Get YARN cluster capacity metrics for running Giraph jobs
          hints:
            readOnly: true
            openWorld: true
          call: "giraph-job.get-cluster-metrics"
          outputParameters:
            - type: object
              mapping: "$."
