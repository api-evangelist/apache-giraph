naftiko: 1.0.0-alpha2
info:
  label: Apache Giraph Graph Processing
  description: Capability for monitoring Apache Giraph graph processing jobs on Hadoop YARN — tracking job status, completion
    progress, and cluster capacity. Designed for data engineers running large-scale graph algorithms. Note - Apache Giraph
    has been retired.
  tags:
  - Apache Giraph
  - Graph Processing
  - Big Data
  - Hadoop
  - Monitoring
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    YARN_RESOURCEMANAGER_URL: YARN_RESOURCEMANAGER_URL
capability:
  consumes:
  - type: http
    namespace: giraph-job
    baseUri: http://localhost:8088
    description: YARN ResourceManager REST API for Giraph job monitoring
    resources:
    - name: jobs
      path: /ws/v1/cluster/apps
      description: Giraph job management via YARN
      operations:
      - name: list-giraph-jobs
        method: GET
        description: List all Giraph graph processing jobs on YARN
        inputParameters:
        - name: applicationTypes
          in: query
          type: string
          required: false
          description: Filter by application type
        - name: states
          in: query
          type: string
          required: false
          description: Filter by job state
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-giraph-job
        method: GET
        description: Get details of a specific Giraph job
        inputParameters:
        - name: appId
          in: path
          type: string
          required: true
          description: YARN application ID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: cluster
      path: /ws/v1/cluster/metrics
      description: YARN cluster metrics
      operations:
      - name: get-cluster-metrics
        method: GET
        description: Get YARN cluster metrics for Giraph job capacity
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: giraph-processing-api
    description: REST API for Apache Giraph graph processing job monitoring.
    resources:
    - path: /v1/jobs
      name: jobs
      description: Giraph graph processing jobs
      operations:
      - method: GET
        name: list-jobs
        description: List all Giraph graph processing jobs
        call: giraph-job.list-giraph-jobs
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/cluster/metrics
      name: metrics
      description: Cluster capacity metrics
      operations:
      - method: GET
        name: get-metrics
        description: Get YARN cluster metrics
        call: giraph-job.get-cluster-metrics
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: giraph-processing-mcp
    transport: http
    description: MCP server for AI-assisted Apache Giraph graph processing monitoring.
    tools:
    - name: list-giraph-jobs
      description: List all Giraph graph processing jobs running on YARN
      hints:
        readOnly: true
        openWorld: true
      call: giraph-job.list-giraph-jobs
      outputParameters:
      - type: object
        mapping: $.
    - name: get-giraph-job
      description: Get detailed status of a specific Giraph job
      hints:
        readOnly: true
        openWorld: true
      call: giraph-job.get-giraph-job
      with:
        appId: tools.appId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-cluster-metrics
      description: Get YARN cluster capacity metrics for running Giraph jobs
      hints:
        readOnly: true
        openWorld: true
      call: giraph-job.get-cluster-metrics
      outputParameters:
      - type: object
        mapping: $.
