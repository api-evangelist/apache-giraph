vocabulary: "1.0.0"
info:
  provider: "Apache Giraph"
  description: "Vocabulary taxonomy for Apache Giraph graph processing covering job management, cluster metrics, and BSP graph computation. Note - Apache Giraph has been retired."
  created: "2026-04-19"
  modified: "2026-04-19"
operational:
  apis:
    - namespace: giraph-job
      version: "1.3.0"
      baseUrl: "http://localhost:8088"
      status: deprecated
      description: Apache Giraph Job Monitoring via YARN REST API
  resources:
    - name: jobs
      apis: [giraph-job]
      actions: [list, get]
    - name: cluster
      apis: [giraph-job]
      actions: [get]
  actions:
    - name: list
      httpMethods: [GET]
      pattern: read
    - name: get
      httpMethods: [GET]
      pattern: read
  schemas:
    core:
      - name: ApplicationInfo
        description: YARN application (Giraph job) status
      - name: ClusterMetricsResponse
        description: YARN cluster capacity metrics
  parameters:
    identifiers:
      - name: appId
        description: YARN application ID for the Giraph job
    filters:
      - name: applicationTypes
        description: Filter by YARN application type
      - name: states
        description: Filter by job state
  enums:
    jobStates:
      - NEW
      - SUBMITTED
      - ACCEPTED
      - RUNNING
      - FINISHED
      - FAILED
      - KILLED
    finalStatus:
      - UNDEFINED
      - SUCCEEDED
      - FAILED
      - KILLED
  authentication:
    schemes:
      - type: None
        description: YARN REST API typically runs within internal network
capability:
  workflows:
    - name: Graph Processing
      file: capabilities/giraph-graph-processing.yaml
      description: Monitor Giraph graph processing jobs on Hadoop YARN
      apis: [giraph-job]
      toolCount: 3
      personas: [Data Engineer]
      domains: [Graph Processing, Monitoring]
  personas:
    - id: data-engineer
      name: Data Engineer
      description: Engineers running large-scale graph algorithms with Giraph on Hadoop
      workflows: [Graph Processing]
  domains:
    - name: Graph Processing
      description: Iterative BSP graph algorithm execution at scale
    - name: Monitoring
      description: Job status tracking and cluster capacity monitoring
  namespaces:
    - name: giraph-job
      type: consumed
    - name: giraph-processing-api
      type: rest-exposed
      port: 8080
    - name: giraph-processing-mcp
      type: mcp-exposed
      port: 9090
  binds:
    - name: YARN_RESOURCEMANAGER_URL
      workflows: [Graph Processing]
crossReference:
  - resource: jobs
    operations: [list-giraph-jobs, get-giraph-job]
    workflows: [Graph Processing]
    personas: [Data Engineer]
  - resource: cluster
    operations: [get-cluster-metrics]
    workflows: [Graph Processing]
    personas: [Data Engineer]
